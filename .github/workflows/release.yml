name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            platform: darwin
            arch: arm64
            targets: '@electron-forge/maker-zip'
          - name: macOS x64
            os: macos-13
            platform: darwin
            arch: x64
            targets: '@electron-forge/maker-zip'
          - name: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
            targets: '@electron-forge/maker-zip,@electron-forge/maker-squirrel'
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
            targets: '@electron-forge/maker-zip,@electron-forge/maker-deb'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use official npm/electron mirrors on CI
        shell: bash
        run: |
          # GitHub-hosted runners 用官方源更稳；仓库 .npmrc 的 npmmirror 面向国内本机
          cat > .npmrc <<'EOF'
          registry=https://registry.npmjs.org/
          fund=false
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Verify forge config
        run: node -e "const c=require('./forge.config.js'); console.log('makers', c.makers.map(m=>m.name))"

      - name: Make distributables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "node $(node -v) platform=${{ matrix.platform }} arch=${{ matrix.arch }} targets=${{ matrix.targets }}"
          npx electron-forge make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --targets=${{ matrix.targets }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WubiDictEditor-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p dist
          find release-assets -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.nupkg' -o -name '*.deb' -o -name '*.rpm' -o -name 'RELEASES' \) \
            -print -exec cp -f {} dist/ \;
          ls -lah dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
