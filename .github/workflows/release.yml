name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            platform: darwin
            arch: arm64
          - name: macOS x64
            os: macos-13
            platform: darwin
            arch: x64
          - name: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild macOS DMG native modules
        if: runner.os == 'macOS'
        run: |
          npm rebuild macos-alias fs-xattr --build-from-source
          node -e "require('macos-alias'); console.log('macos-alias ok')"

      - name: Make distributables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "node $(node -v) npm $(npm -v) platform=${{ matrix.platform }} arch=${{ matrix.arch }}"
          case "${{ matrix.platform }}" in
            darwin)
              # zip 稳定；dmg 依赖原生模块，失败不阻断发布
              npx electron-forge make --platform=darwin --arch=${{ matrix.arch }} --targets=@electron-forge/maker-zip
              npx electron-forge make --platform=darwin --arch=${{ matrix.arch }} --targets=@electron-forge/maker-dmg \
                || echo "::warning::DMG failed; zip artifact is still available"
              ;;
            linux)
              # rpm 在部分 runner 上易失败；zip + deb 足够分发
              npx electron-forge make --platform=linux --arch=${{ matrix.arch }} \
                --targets=@electron-forge/maker-zip,@electron-forge/maker-deb
              ;;
            *)
              npx electron-forge make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
              ;;
          esac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WubiDictEditor-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p dist
          find release-assets -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.nupkg' -o -name '*.deb' -o -name '*.rpm' -o -name 'RELEASES' \) \
            -print -exec cp -f {} dist/ \;
          ls -lah dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
